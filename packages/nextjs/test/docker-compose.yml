# Throwaway Postgres for integration tests. Data lives in memory and disappears on `down`.
#   yarn test:db:up   # start
#   yarn test:db:down # stop
name: arl-mini-lib-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arlib
      POSTGRES_PASSWORD: arlib
      POSTGRES_DB: arlib_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arlib -d arlib_test"]
      interval: 1s
      timeout: 3s
      retries: 30
