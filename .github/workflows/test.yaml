name: Test

on:
  # Every PR, including ones stacked on another PR's branch.
  pull_request:
  push:
    branches: [main]
  # Vercel reports each finished deployment back to GitHub; smoke-test previews as they go live.
  deployment_status:

jobs:
  checks:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nextjs

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arlib
          POSTGRES_PASSWORD: arlib
          POSTGRES_DB: arlib_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U arlib -d arlib_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: yarn check-types

      - name: Lint
        run: yarn lint --max-warnings=0

      - name: Unit tests
        run: yarn test

      - name: Integration tests
        run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgresql://arlib:arlib@localhost:54329/arlib_test

      # Builds without any secrets, then fails if browser JavaScript contains a Supabase secret key.
      - name: Build and check for leaked secrets
        run: yarn build

  preview-smoke:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nextjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the preview
        run: yarn test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/nextjs/playwright-report
          retention-days: 14
